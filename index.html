<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTProxy — подключение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c10;--surface:#0d1318;--border:#1a2330;--border2:#243040;--accent:#00e5ff;--secure:#00e676;--classic:#448aff;--tls:#e040fb;--text:#e8f4f8;--muted:#5a7a8a;--muted2:#3a5060}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:500px}
.header{text-align:center;margin-bottom:2.5rem;animation:fadeDown .6s ease both}
.logo{font-family:'Unbounded',sans-serif;font-size:1.35rem;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.5rem}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sub{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.greet-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1.5rem 1.75rem;margin-bottom:1.25rem;animation:fadeUp .5s .05s ease both}
.greet-name{font-family:'Unbounded',sans-serif;font-size:1.1rem;font-weight:700;color:var(--accent);margin-bottom:.3rem}
.greet-sub{font-size:.72rem;color:var(--muted);line-height:1.6}
.gen-wrap{animation:fadeUp .5s .1s ease both;margin-bottom:1.25rem}
.gen-btn{width:100%;background:var(--accent);color:#080c10;border:none;border-radius:12px;padding:1rem;font-family:'Unbounded',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:.15s;display:flex;align-items:center;justify-content:center;gap:.6rem}
.gen-btn:hover{background:#33eaff}
.gen-btn:active{transform:scale(.98)}
#results{display:none;flex-direction:column;gap:.75rem}
.link-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;position:relative;overflow:hidden}
.link-block::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.link-block.secure{border-color:rgba(0,230,118,.2)}.link-block.secure::before{background:var(--secure)}
.link-block.classic{border-color:rgba(68,138,255,.2)}.link-block.classic::before{background:var(--classic)}
.link-block.tls{border-color:rgba(224,64,251,.2)}.link-block.tls::before{background:var(--tls)}
.block-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem}
.block-badge{font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .55rem;border-radius:4px}
.secure .block-badge{background:rgba(0,230,118,.12);color:var(--secure)}
.classic .block-badge{background:rgba(68,138,255,.12);color:var(--classic)}
.tls .block-badge{background:rgba(224,64,251,.12);color:var(--tls)}
.block-rec{font-size:.6rem;color:var(--muted);margin-left:auto}
.link-url{font-size:.68rem;color:var(--muted);word-break:break-all;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;margin-bottom:.9rem;line-height:1.5}
.btn-row{display:flex;gap:.5rem}
.btn-tg{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem;border-radius:9px;border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;text-decoration:none;transition:.15s}
.secure .btn-tg{background:rgba(0,230,118,.15);color:var(--secure)}
.classic .btn-tg{background:rgba(68,138,255,.15);color:var(--classic)}
.tls .btn-tg{background:rgba(224,64,251,.15);color:var(--tls)}
.btn-copy{background:var(--border);color:var(--muted);border:none;border-radius:9px;padding:.65rem .9rem;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.7rem;transition:.15s}
.btn-copy:hover{background:var(--border2);color:var(--text)}
.btn-copy.copied{background:rgba(0,230,118,.15);color:var(--secure)}
.noref-card{background:var(--surface);border:1px solid rgba(255,82,82,.25);border-radius:16px;padding:2rem 1.75rem;text-align:center;animation:fadeUp .5s ease both}
.noref-title{font-family:'Unbounded',sans-serif;font-size:.9rem;color:#ff5252;margin-bottom:.5rem}
.noref-text{font-size:.75rem;color:var(--muted);line-height:1.7}
.warn-block{background:rgba(255,171,0,.06);border:1px solid rgba(255,171,0,.2);border-radius:12px;padding:1rem 1.25rem;font-size:.7rem;color:#ffca28;line-height:1.6}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#080c10" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      MTProxy
    </div>
    <div class="sub">Персональный доступ</div>
  </div>
  <div id="app"></div>
</div>

<script>
// ── Конфиг — меняй только здесь ──────────────────────────────────────────
const HOST       = 'wwcat.duckdns.org';
const PORT       = '8043';
const TLS_DOMAIN = 'cloudflare.com';
const SECRET     = '653cab966271b2e8b4f698852bbcf86f';
const ADMIN_URL  = 'http://localhost:5000'; // твоя локальная панель
// ─────────────────────────────────────────────────────────────────────────

const ref = new URLSearchParams(location.search).get('ref') || '';
const app = document.getElementById('app');

function hexEncode(s){ return Array.from(s).map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(''); }
function buildLinks(){
  const b=SECRET.toLowerCase(), h=hexEncode(TLS_DOMAIN);
  return{
    secure:  `https://t.me/proxy?server=${HOST}&port=${PORT}&secret=dd${b}`,
    classic: `https://t.me/proxy?server=${HOST}&port=${PORT}&secret=${b}`,
    tls:     `https://t.me/proxy?server=${HOST}&port=${PORT}&secret=ee${b}${h}`,
  };
}

// Тихий лог в локальную панель (no-cors — ответ не нужен)
function logEvent(action){
  if(!ref) return;
  const body = JSON.stringify({ ref, action, ts: new Date().toISOString() });
  try { navigator.sendBeacon(ADMIN_URL+'/log', new Blob([body],{type:'application/json'})); } catch(_){}
  try { fetch(ADMIN_URL+'/log',{method:'POST',body,mode:'no-cors',keepalive:true}).catch(()=>{}); } catch(_){}
}

function tgSvg(){ return `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248-1.97 9.289c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.932z"/></svg>`; }

if(!ref){
  app.innerHTML=`<div class="noref-card"><div class="noref-title">🔒 Ссылка недействительна</div><div class="noref-text">Доступ только по персональной ссылке.<br>Обратись к администратору.</div></div>`;
} else {
  logEvent('open');
  app.innerHTML=`
    <div class="greet-card">
      <div class="greet-name">Привет, ${ref}!</div>
      <div class="greet-sub">Нажми кнопку — получишь готовые ссылки для подключения к прокси.</div>
    </div>
    <div class="gen-wrap">
      <button class="gen-btn" onclick="showLinks()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Получить ссылки
      </button>
    </div>
    <div id="results" style="display:none;flex-direction:column;gap:.75rem"></div>`;
}

function showLinks(){
  logEvent('links_shown');
  const L=buildLinks();
  const blocks=[
    {cls:'secure', badge:'🔒 Secure',  rec:'рекомендуется',       id:'u-s',url:L.secure},
    {cls:'classic',badge:'📱 Classic',rec:'Android старые версии',id:'u-c',url:L.classic},
    {cls:'tls',    badge:'🌐 TLS',    rec:'маскировка трафика',   id:'u-t',url:L.tls},
  ];
  let html='';
  for(const b of blocks){
    html+=`<div class="link-block ${b.cls}" style="animation:fadeUp .35s ease both">
      <div class="block-head"><span class="block-badge">${b.badge}</span><span class="block-rec">${b.rec}</span></div>
      <div class="link-url" id="${b.id}">${b.url}</div>
      <div class="btn-row">
        <a class="btn-tg" href="${b.url}">${tgSvg()} Открыть в Telegram</a>
        <button class="btn-copy" onclick="cp('${b.id}',this)">Копировать</button>
      </div>
    </div>`;
  }
  html+=`<div class="warn-block">⚠️ Ссылки выданы лично тебе. Не передавай их другим — доступ будет отозван.</div>`;
  const r=document.getElementById('results');
  r.style.display='flex'; r.innerHTML=html;
  document.querySelector('.gen-btn').style.display='none';
}

function cp(id,btn){
  navigator.clipboard.writeText(document.getElementById(id).textContent.trim()).then(()=>{
    const o=btn.textContent; btn.textContent='✓ Скопировано'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},2000);
  });
}
</script>
</body>
</html>
